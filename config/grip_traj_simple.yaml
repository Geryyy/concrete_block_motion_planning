grip_traj_server:
  ros__parameters:
    service_name: "grip_traj_movement"
    joint_states_topic: "/joint_states"
    controlled_joint_names:
      - "theta1_slewing_joint"
      - "theta2_boom_joint"
      - "theta3_arm_joint"
      - "q4_big_telescope"
      - "theta6_tip_joint"
      - "theta7_tilt_joint"
      - "theta8_rotator_joint"
      - "q9_left_rail_joint"
    dt_target: 0.01
    tcp_z_offset: 0.95  # K8 → virtual TCP (grip point), PZS100 rail length
    block_grip_z_offset: 0.2  # Block center -> virtual TCP / grip point
    use_passive_steady_state: true
    # A lift ENDS with the block hanging free, which is equilibrium again.  The
    # tilt measured at lift-off is a contact artifact -- the gripper resting on
    # a block on uneven ground held theta6 at 39 deg statically -- and no pose
    # the crane can hold preserves it once the block leaves the ground.  Solving
    # the lift against that frozen tilt made the IK unsatisfiable (all four
    # fallback lift heights failed instantly).  The low-level MPC damps the
    # swing excited during the ascent.
    lift_use_passive_steady_state: true
    passive_steady_state_iterations: 3
    # Informational only: published as /grip_traj/passive_{settled,velocity_rms}.
    # It does not block a lift. Tune after measuring real passive-joint noise.
    passive_settle_velocity_threshold_radps: 0.02
    passive_settle_window_s: 0.75
    lift_height: 1.0
    # Real-PZS100 coordinates.  q9_left_rail_joint is the rail travel reported
    # by EpsilonCraneHardwareInterface, and the live /robot_description limits
    # it to [0.0, 0.538] (velocity 0.12).  The previous values (open 1.4 /
    # close 0.55) were Gazebo coordinates, where q9 is the TOTAL gripper
    # opening; both sat above the 0.538 end stop, so every gripper move on
    # hardware clamped to the limit the jaws already rested on -- q9 stayed at
    # ~0.539, FollowJointTrajectory "succeeded" having moved nothing, and the
    # grasp check timed out.  The Gazebo launches share this file and will need
    # their own overlay when sim is used again.
    gripper_open_position: 0.538  # open end stop
    # Command the rails shut and let the block stall them -- that residual
    # command error is what builds squeeze.  A held block stops q9 around
    # 0.1-0.2, which is what position_window in gripper_grasp_detector_real.yaml
    # brackets; an empty close runs down to ~0.0 and is correctly rejected.
    gripper_close_position: 0.0
    # q9 is already the commanded joint coordinate on hardware -- no halving.
    gripper_command_scale: 1.0
    # Authoritative q9 limits (in the commanded q9 coordinate) for the
    # rest-to-rest minimum-time profile.
    # Tune these on real hardware; the planner will never exceed them.
    gripper_max_velocity_mps: 0.10
    gripper_max_acceleration_mps2: 0.25
    # Per-segment durations in seconds for the multi-joint crane motions.
    # LIFT uses a zero-acceleration, minimum-jerk profile; increase this first
    # if lift-off excites passive-joint sway.
    duration_descend: 5.0
    duration_lift: 5.0
